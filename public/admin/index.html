<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tdme · Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
    input:focus { border-color: #1d1d1f !important; outline: none; }
    button { font-family: 'Inter', -apple-system, sans-serif; }
    button:hover:not(:disabled) { opacity: 0.75; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const WORKER_URL = "https://tdme-input.wmellaart.workers.dev";

    const C = { white:"#ffffff", bg:"#f5f5f7", ink:"#1d1d1f", mid:"#6e6e73", light:"#aeaeb2", border:"#e5e5ea" };

    const fmt = (text) =>
      text.split("\n").map((line, i, arr) => (
        <span key={i}>{line}{i < arr.length - 1 && <br />}</span>
      ));

    const formatDate = (iso) => new Date(iso).toLocaleString("nl-NL", {
      day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit"
    });

    function RadarChart({ data, size = 260 }) {
      const n = data.length;
      const cx = size / 2, cy = size / 2, r = size * 0.32;
      const ang = (i) => (2 * Math.PI * i / n) - Math.PI / 2;
      const pt  = (i, s) => ({ x: cx + r * (s / 10) * Math.cos(ang(i)), y: cy + r * (s / 10) * Math.sin(ang(i)) });
      const gridLevels = [0.25, 0.5, 0.75, 1].map(ratio =>
        data.map((_, i) => `${cx + r * ratio * Math.cos(ang(i))},${cy + r * ratio * Math.sin(ang(i))}`).join(" ")
      );
      const dataPoints = data.map((d, i) => { const p = pt(i, d.score); return `${p.x},${p.y}`; }).join(" ");
      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:"block", margin:"0 auto" }}>
          {gridLevels.map((pts, l) => <polygon key={l} points={pts} fill="none" stroke="#e5e5ea" strokeWidth="1" />)}
          {data.map((_, i) => <line key={i} x1={cx} y1={cy} x2={cx + r * Math.cos(ang(i))} y2={cy + r * Math.sin(ang(i))} stroke="#e5e5ea" strokeWidth="1" />)}
          <polygon points={dataPoints} fill="rgba(29,29,31,0.08)" stroke="#1d1d1f" strokeWidth="2" />
          {data.map((d, i) => { const p = pt(i, d.score); return <circle key={i} cx={p.x} cy={p.y} r="4" fill="#1d1d1f" />; })}
          {data.map((d, i) => {
            const lr = r + 28;
            const x = cx + lr * Math.cos(ang(i)), y = cy + lr * Math.sin(ang(i));
            return (
              <g key={i}>
                <text x={x} y={y - 5}  textAnchor="middle" fontSize="9"  fontFamily="Inter,sans-serif" fill="#6e6e73">{d.naam}</text>
                <text x={x} y={y + 8}  textAnchor="middle" fontSize="11" fontFamily="Inter,sans-serif" fontWeight="600" fill="#1d1d1f">{d.score}</text>
              </g>
            );
          })}
        </svg>
      );
    }

    function Admin() {
      const [phase,    setPhase]    = useState("login");
      const [key,      setKey]      = useState("");
      const [keyErr,   setKeyErr]   = useState("");
      const [convos,   setConvos]   = useState([]);
      const [loading,  setLoading]  = useState(false);
      const [selected, setSelected] = useState(null);
      const [detail,   setDetail]   = useState(null);

      const login = async () => {
        if (!key.trim()) { setKeyErr("Voer een admin-sleutel in."); return; }
        setLoading(true);
        try {
          const res = await fetch(`${WORKER_URL}/list`, {
            headers: { "X-Admin-Key": key }
          });
          if (res.status === 401) { setKeyErr("Ongeldige sleutel."); setLoading(false); return; }
          const data = await res.json();
          setConvos(data);
          setPhase("list");
        } catch {
          setKeyErr("Verbindingsfout. Probeer opnieuw.");
        }
        setLoading(false);
      };

      const openConvo = async (id) => {
        setSelected(id);
        setDetail(null);
        const res = await fetch(`${WORKER_URL}/conversation/${id}`, {
          headers: { "X-Admin-Key": key }
        });
        const data = await res.json();
        setDetail(data);
        setPhase("detail");
      };

      const getDisplayText = (msg) => {
        if (typeof msg.content === "string") return msg.content;
        return (msg.content || []).filter(b => b.type === "text").map(b => b.text).join(" ");
      };

      const downloadConvo = (convo) => {
        const date = new Date(convo.timestamp).toISOString().slice(0, 10);
        const lines = (convo.messages || []).map(m =>
          `**${m.role === "assistant" ? "Agent" : "Founder"}:** ${getDisplayText(m)}`
        ).join("\n\n");
        const blob = new Blob([`# tdme Gesprek — ${date}\n\n---\n\n${lines}`], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `tdme-gesprek-${date}.md`; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const hdr = (
        <div style={{ padding:"12px 20px", borderBottom:`1px solid ${C.border}`, display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
          <span style={{ fontSize:"13px", color:C.light, fontWeight:500 }}>tdme · Admin</span>
          {phase !== "login" && (
            <button onClick={() => { setPhase("list"); setDetail(null); setSelected(null); }}
              style={{ fontSize:"12px", color:C.mid, background:"transparent", border:`1px solid ${C.border}`, borderRadius:"980px", padding:"5px 12px", cursor:"pointer" }}>
              ← Overzicht
            </button>
          )}
        </div>
      );

      // LOGIN
      if (phase === "login") return (
        <div style={{ minHeight:"100dvh", display:"flex", flexDirection:"column", background:C.white }}>
          {hdr}
          <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"24px", padding:"48px 24px" }}>
            <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:"8px" }}>
              <p style={{ fontSize:"12px", letterSpacing:"1px", color:C.light }}>tdme · Admin</p>
              <h1 style={{ fontSize:"32px", fontWeight:600, letterSpacing:"-1px", color:C.ink }}>Gesprekken</h1>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:"8px", width:"100%", maxWidth:"280px", alignItems:"center" }}>
              <input type="password" placeholder="Admin-sleutel" value={key}
                onChange={e => { setKey(e.target.value); setKeyErr(""); }}
                onKeyDown={e => e.key === "Enter" && login()} autoFocus
                style={{ width:"100%", padding:"11px 16px", fontSize:"15px", fontFamily:"Inter,-apple-system,sans-serif", border:`1px solid ${C.border}`, borderRadius:"980px", background:C.bg, color:C.ink, textAlign:"center", letterSpacing:"2px" }} />
              {keyErr && <p style={{ fontSize:"13px", color:"#c0392b" }}>{keyErr}</p>}
              <button onClick={login} disabled={loading}
                style={{ width:"100%", padding:"11px", background:C.ink, color:C.white, border:"none", borderRadius:"980px", fontSize:"15px", fontWeight:500, cursor:"pointer" }}>
                {loading ? "Laden…" : "Inloggen"}
              </button>
            </div>
          </div>
        </div>
      );

      // LIST
      if (phase === "list") return (
        <div style={{ minHeight:"100dvh", display:"flex", flexDirection:"column", background:C.white }}>
          {hdr}
          <div style={{ flex:1, overflow:"auto", padding:"24px 32px", maxWidth:"720px", width:"100%", margin:"0 auto", alignSelf:"center" }}>
            <h2 style={{ fontSize:"22px", fontWeight:600, letterSpacing:"-0.5px", marginBottom:"20px" }}>
              {convos.length} gesprek{convos.length !== 1 ? "ken" : ""}
            </h2>
            {convos.length === 0 ? (
              <p style={{ color:C.mid, fontSize:"15px" }}>Nog geen gesprekken opgeslagen.</p>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", gap:"8px" }}>
                {convos.map(c => (
                  <div key={c.id} onClick={() => openConvo(c.id)}
                    style={{ padding:"16px 20px", border:`1px solid ${C.border}`, borderRadius:"12px", cursor:"pointer", background:C.white, transition:"background 0.15s" }}
                    onMouseEnter={e => e.currentTarget.style.background = C.bg}
                    onMouseLeave={e => e.currentTarget.style.background = C.white}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:"12px" }}>
                      <p style={{ fontSize:"15px", color:C.ink, lineHeight:1.5, flex:1 }}>
                        {c.preview || "Geen preview"}
                      </p>
                      <span style={{ fontSize:"12px", color:C.light, whiteSpace:"nowrap", marginTop:"2px" }}>
                        {formatDate(c.timestamp)}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );

      // DETAIL
      return (
        <div style={{ minHeight:"100dvh", display:"flex", flexDirection:"column", background:C.white }}>
          {hdr}
          <div style={{ flex:1, overflow:"auto", padding:"24px 32px", maxWidth:"720px", width:"100%", margin:"0 auto", alignSelf:"center" }}>
            {!detail ? (
              <p style={{ color:C.mid }}>Laden…</p>
            ) : (
              <>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"20px" }}>
                  <p style={{ fontSize:"13px", color:C.light }}>{formatDate(detail.timestamp)}</p>
                  <button onClick={() => downloadConvo(detail)}
                    style={{ fontSize:"12px", color:C.mid, background:"transparent", border:`1px solid ${C.border}`, borderRadius:"980px", padding:"5px 12px", cursor:"pointer" }}>
                    Download .md
                  </button>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>
                  {(detail.messages || []).map((msg, i) => {
                    const text = getDisplayText(msg);
                    const isAgent = msg.role === "assistant";
                    return (
                      <div key={i} style={{ display:"flex", flexDirection:"column", gap:"3px", alignSelf: isAgent ? "flex-start" : "flex-end", maxWidth:"85%" }}>
                        <span style={{ fontSize:"10px", letterSpacing:"1.5px", textTransform:"uppercase", color:C.light, fontWeight:500 }}>
                          {isAgent ? "Agent" : "Founder"}
                        </span>
                        <div style={{ background: isAgent ? C.bg : C.ink, color: isAgent ? C.ink : C.white, padding:"12px 16px", borderRadius: isAgent ? "4px 18px 18px 18px" : "18px 4px 18px 18px", fontSize:"15px", lineHeight:1.6 }}>
                          {fmt(text)}
                        </div>
                      </div>
                    );
                  })}
                </div>
                {detail.diagram && !detail.diagram.error && (
                  <div style={{ marginTop:"32px", border:`1px solid ${C.border}`, borderRadius:"16px", padding:"20px" }}>
                    <p style={{ fontSize:"11px", letterSpacing:"1px", textTransform:"uppercase", color:C.light, marginBottom:"16px", textAlign:"center" }}>
                      Analyse · {detail.diagram.bedrijf}
                    </p>
                    <RadarChart data={detail.diagram.assen} />
                    <div style={{ marginTop:"20px", display:"flex", flexDirection:"column", gap:"8px" }}>
                      {detail.diagram.assen.map((as, i) => (
                        <div key={i} style={{ display:"flex", gap:"10px", alignItems:"flex-start" }}>
                          <span style={{ fontSize:"13px", fontWeight:600, color:C.ink, minWidth:"28px" }}>{as.score}</span>
                          <div>
                            <span style={{ fontSize:"13px", fontWeight:500, color:C.ink }}>{as.naam}</span>
                            <span style={{ fontSize:"13px", color:C.mid }}> — {as.toelichting}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Admin />);
  </script>
</body>
</html>
