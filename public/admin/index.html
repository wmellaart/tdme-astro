<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tdme · Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #fff; font-family: 'Inter', -apple-system, sans-serif; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
    input:focus, textarea:focus { border-color: #1d1d1f !important; outline: none; }
    button { font-family: 'Inter', -apple-system, sans-serif; }
    button:hover:not(:disabled) { opacity: 0.75; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 2px; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-4px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0.12); }
      50%       { box-shadow: 0 0 0 7px rgba(0,0,0,0); }
    }
    .msg-enter { animation: fadeIn 0.18s ease forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const WORKER_URL = "https://tdme-input.wmellaart.workers.dev";
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const hasSpeech = !!SpeechRecognition;

    const C = { white:"#ffffff", bg:"#f5f5f7", ink:"#1d1d1f", mid:"#6e6e73", light:"#aeaeb2", border:"#e5e5ea" };

    const fmt = (text) =>
      text.split("\n").map((line, i, arr) => (
        <span key={i}>{line}{i < arr.length - 1 && <br />}</span>
      ));

    const formatDate = (iso) => new Date(iso).toLocaleString("nl-NL", {
      day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit"
    });

    // ── RADAR CHART ──────────────────────────────────────────────────────────

    function RadarChart({ data, size = 260 }) {
      const n = data.length;
      const cx = size / 2, cy = size / 2, r = size * 0.32;
      const ang = (i) => (2 * Math.PI * i / n) - Math.PI / 2;
      const pt  = (i, s) => ({ x: cx + r * (s / 10) * Math.cos(ang(i)), y: cy + r * (s / 10) * Math.sin(ang(i)) });
      const gridLevels = [0.25, 0.5, 0.75, 1].map(ratio =>
        data.map((_, i) => `${cx + r * ratio * Math.cos(ang(i))},${cy + r * ratio * Math.sin(ang(i))}`).join(" ")
      );
      const dataPoints = data.map((d, i) => { const p = pt(i, d.score); return `${p.x},${p.y}`; }).join(" ");
      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:"block", margin:"0 auto" }}>
          {gridLevels.map((pts, l) => <polygon key={l} points={pts} fill="none" stroke="#e5e5ea" strokeWidth="1" />)}
          {data.map((_, i) => <line key={i} x1={cx} y1={cy} x2={cx + r * Math.cos(ang(i))} y2={cy + r * Math.sin(ang(i))} stroke="#e5e5ea" strokeWidth="1" />)}
          <polygon points={dataPoints} fill="rgba(29,29,31,0.08)" stroke="#1d1d1f" strokeWidth="2" />
          {data.map((d, i) => { const p = pt(i, d.score); return <circle key={i} cx={p.x} cy={p.y} r="4" fill="#1d1d1f" />; })}
          {data.map((d, i) => {
            const lr = r + 28;
            const x = cx + lr * Math.cos(ang(i)), y = cy + lr * Math.sin(ang(i));
            return (
              <g key={i}>
                <text x={x} y={y - 5}  textAnchor="middle" fontSize="9"  fontFamily="Inter,sans-serif" fill="#6e6e73">{d.naam}</text>
                <text x={x} y={y + 8}  textAnchor="middle" fontSize="11" fontFamily="Inter,sans-serif" fontWeight="600" fill="#1d1d1f">{d.score}</text>
              </g>
            );
          })}
        </svg>
      );
    }

    // ── MIC ICON ─────────────────────────────────────────────────────────────

    const MicIcon = ({ on }) => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3" fill={on ? "currentColor" : "none"} />
        <path d="M5 10a7 7 0 0 0 14 0" />
        <line x1="12" y1="19" x2="12" y2="22" />
        <line x1="8" y1="22" x2="16" y2="22" />
      </svg>
    );

    // ── GESPREKKEN TAB ───────────────────────────────────────────────────────

    function Gesprekken({ adminKey }) {
      const [convos,   setConvos]   = useState([]);
      const [loading,  setLoading]  = useState(true);
      const [selected, setSelected] = useState(null);
      const [detail,   setDetail]   = useState(null);

      useEffect(() => {
        fetch(`${WORKER_URL}/list`, { headers: { "X-Admin-Key": adminKey } })
          .then(r => r.json()).then(setConvos).finally(() => setLoading(false));
      }, []);

      const openConvo = async (id) => {
        setSelected(id); setDetail(null);
        const res = await fetch(`${WORKER_URL}/conversation/${id}`, { headers: { "X-Admin-Key": adminKey } });
        setDetail(await res.json());
      };

      const getDisplayText = (msg) => {
        if (typeof msg.content === "string") return msg.content;
        return (msg.content || []).filter(b => b.type === "text").map(b => b.text).join(" ");
      };

      const downloadConvo = (convo) => {
        const date = new Date(convo.timestamp).toISOString().slice(0, 10);
        const lines = (convo.messages || []).map(m =>
          `**${m.role === "assistant" ? "Agent" : "Founder"}:** ${getDisplayText(m)}`
        ).join("\n\n");
        const blob = new Blob([`# tdme Gesprek — ${date}\n\n---\n\n${lines}`], { type: "text/markdown;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = `tdme-gesprek-${date}.md`; a.click();
      };

      if (loading) return <p style={{ padding:"32px", color:C.mid }}>Laden…</p>;

      if (selected && detail) return (
        <div style={{ flex:1, overflow:"auto", padding:"24px 32px", maxWidth:"720px", width:"100%", margin:"0 auto", alignSelf:"center" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"20px" }}>
            <button onClick={() => { setSelected(null); setDetail(null); }}
              style={{ fontSize:"12px", color:C.mid, background:"transparent", border:`1px solid ${C.border}`, borderRadius:"980px", padding:"5px 12px", cursor:"pointer" }}>
              ← Overzicht
            </button>
            <div style={{ display:"flex", gap:"8px", alignItems:"center" }}>
              <p style={{ fontSize:"13px", color:C.light }}>{formatDate(detail.timestamp)}</p>
              <button onClick={() => downloadConvo(detail)}
                style={{ fontSize:"12px", color:C.mid, background:"transparent", border:`1px solid ${C.border}`, borderRadius:"980px", padding:"5px 12px", cursor:"pointer" }}>
                Download .md
              </button>
            </div>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>
            {(detail.messages || []).map((msg, i) => {
              const text = getDisplayText(msg);
              const isAgent = msg.role === "assistant";
              return (
                <div key={i} style={{ display:"flex", flexDirection:"column", gap:"3px", alignSelf:isAgent ? "flex-start" : "flex-end", maxWidth:"85%" }}>
                  <span style={{ fontSize:"10px", letterSpacing:"1.5px", textTransform:"uppercase", color:C.light, fontWeight:500 }}>
                    {isAgent ? "Agent" : "Founder"}
                  </span>
                  <div style={{ background:isAgent ? C.bg : C.ink, color:isAgent ? C.ink : C.white, padding:"12px 16px", borderRadius:isAgent ? "4px 18px 18px 18px" : "18px 4px 18px 18px", fontSize:"15px", lineHeight:1.6 }}>
                    {fmt(text)}
                  </div>
                </div>
              );
            })}
          </div>
          {detail.diagram && !detail.diagram.error && (
            <div style={{ marginTop:"32px", border:`1px solid ${C.border}`, borderRadius:"16px", padding:"20px" }}>
              <p style={{ fontSize:"11px", letterSpacing:"1px", textTransform:"uppercase", color:C.light, marginBottom:"16px", textAlign:"center" }}>
                Analyse · {detail.diagram.bedrijf}
              </p>
              <RadarChart data={detail.diagram.assen} />
              <div style={{ marginTop:"20px", display:"flex", flexDirection:"column", gap:"8px" }}>
                {detail.diagram.assen.map((as, i) => (
                  <div key={i} style={{ display:"flex", gap:"10px", alignItems:"flex-start" }}>
                    <span style={{ fontSize:"13px", fontWeight:600, color:C.ink, minWidth:"28px" }}>{as.score}</span>
                    <div>
                      <span style={{ fontSize:"13px", fontWeight:500, color:C.ink }}>{as.naam}</span>
                      <span style={{ fontSize:"13px", color:C.mid }}> — {as.toelichting}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );

      return (
        <div style={{ flex:1, overflow:"auto", padding:"24px 32px", maxWidth:"720px", width:"100%", margin:"0 auto", alignSelf:"center" }}>
          <h2 style={{ fontSize:"22px", fontWeight:600, letterSpacing:"-0.5px", marginBottom:"20px" }}>
            {convos.length} gesprek{convos.length !== 1 ? "ken" : ""}
          </h2>
          {convos.length === 0 ? (
            <p style={{ color:C.mid, fontSize:"15px" }}>Nog geen gesprekken opgeslagen.</p>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:"8px" }}>
              {convos.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).map(c => (
                <div key={c.id} onClick={() => openConvo(c.id)}
                  style={{ padding:"16px 20px", border:`1px solid ${C.border}`, borderRadius:"12px", cursor:"pointer" }}
                  onMouseEnter={e => e.currentTarget.style.background = C.bg}
                  onMouseLeave={e => e.currentTarget.style.background = C.white}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:"12px" }}>
                    <p style={{ fontSize:"15px", color:C.ink, lineHeight:1.5, flex:1 }}>{c.preview || "Geen preview"}</p>
                    <span style={{ fontSize:"12px", color:C.light, whiteSpace:"nowrap", marginTop:"2px" }}>{formatDate(c.timestamp)}</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ── KENNISEXTRACTIE TAB ───────────────────────────────────────────────────

    const KENNIS_SYSTEM = `Je bent een kennisextractie-interviewer. Je taak is om de marketing expertise van Frank Schuyer en Wouter Mellaart systematisch vast te leggen, zodat die gebruikt kan worden als kennisbasis voor de tdme GTM Agent — een AI-assistent die start-ups en scale-ups adviseert op het gebied van go-to-market strategie, positionering, B2B marketing en branding.

Je voert een diepgaand, conversationeel interview. Je doel is om concrete, specifieke en bruikbare inzichten te verzamelen — geen abstracte algemeenheden.

Gespreksonderwerpen (werk ze organisch af, forceer geen volgorde):
1. De frameworks en aanpakken die de persoon structureel gebruikt bij marketing- en groeivraagstukken
2. De meest voorkomende fouten of blinde vlekken die hij ziet bij founders van start-ups en scale-ups
3. Hoe hij go-to-market strategie aanpakt — stappen, valkuilen, succesfactoren
4. Zijn aanpak voor positionering en propositie-ontwikkeling
5. Inzichten over B2B marketing & sales (alignment, pipeline, kanalen)
6. Wat hij ziet werken in digitale marketing en groei voor vroeg-stadium bedrijven
7. Zijn visie op branding en communicatie voor start-ups

Instructies:
- Stel ALTIJD maar één vraag tegelijk
- Vraag door als een antwoord interessant of concreet is — ga de diepte in
- Vermijd algemeenheden — vraag altijd om een voorbeeld, een case, of een vuistregel
- Spreek de persoon aan op zijn voornaam
- Na 12-15 uitwisselingen, of als de persoon aangeeft klaar te zijn, bied je aan om de inzichten samen te vatten
- Schrijf altijd in het Nederlands
- Begin met een warme, professionele introductie en je eerste vraag`;

    const KENNIS_SUMMARY = (name, conversation) =>
`Dit is een transcript van een kennisextractie-interview met ${name}:

${conversation}

Maak nu een gestructureerde samenvatting van alle opgehaalde kennis en inzichten. Gebruik de volgende structuur:

## Marketing frameworks & aanpakken
## Veelgemaakte fouten bij founders
## Go-to-market aanpak
## Positionering & propositie
## B2B marketing & sales
## Digitale marketing & groei
## Branding & communicatie
## Overige inzichten & vuistregels

Wees specifiek en concreet. Dit wordt direct gebruikt als kennisbasis voor een AI-agent.`;

    function Kennisextractie() {
      const [phase,     setPhase]     = useState("start");
      const [expert,    setExpert]    = useState(null);
      const [messages,  setMessages]  = useState([]);
      const [input,     setInput]     = useState("");
      const [loading,   setLoading]   = useState(false);
      const [summary,   setSummary]   = useState("");
      const [msgCount,  setMsgCount]  = useState(0);
      const [saved,     setSaved]     = useState(false);
      const [listening, setListening] = useState(false);
      const [interim,   setInterim]   = useState("");

      const bottomRef  = useRef(null);
      const inputRef   = useRef(null);
      const recognizer = useRef(null);

      useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:"smooth" }); }, [messages, loading]);
      useEffect(() => { if (phase === "chat" && !loading) inputRef.current?.focus(); }, [phase, loading]);

      useEffect(() => {
        if (!hasSpeech) return;
        const r = new SpeechRecognition();
        r.lang = "nl-NL"; r.continuous = true; r.interimResults = true;
        r.onresult = (e) => {
          let fin = "", intr = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            e.results[i].isFinal ? fin += t : intr += t;
          }
          if (fin) setInput(p => (p + " " + fin).trim());
          setInterim(intr);
        };
        r.onend  = () => { setListening(false); setInterim(""); };
        r.onerror= () => { setListening(false); setInterim(""); };
        recognizer.current = r;
        return () => { try { r.stop(); } catch(_) {} };
      }, []);

      const toggleMic = () => {
        if (!hasSpeech) return;
        if (listening) { recognizer.current.stop(); setListening(false); }
        else { try { recognizer.current.start(); setListening(true); } catch(_) {} }
      };
      const stopMic = () => { if (listening) { recognizer.current.stop(); setListening(false); } };

      const callClaude = async (system, msgs, maxTokens = 1000) => {
        const body = { model:"claude-sonnet-4-6", max_tokens:maxTokens, messages:msgs };
        if (system) body.system = system;
        const res = await fetch(WORKER_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        return data.content?.[0]?.text || "";
      };

      const fullName = expert === "frank" ? "Frank Schuyer" : "Wouter Mellaart";

      const startSession = async (person) => {
        setExpert(person); setPhase("chat"); setLoading(true);
        const n = person === "frank" ? "Frank" : "Wouter";
        const seed = [{ role:"user", content:`Hallo, ik ben ${n}.` }];
        try {
          const reply = await callClaude(KENNIS_SYSTEM, seed);
          setMessages([...seed, { role:"assistant", content:reply }]);
          setMsgCount(1);
        } catch(e) {
          setMessages([...seed, { role:"assistant", content:`Fout: ${e.message}` }]);
        }
        setLoading(false);
      };

      const sendMessage = async () => {
        stopMic();
        if (!input.trim() || loading) return;
        const userMsg = { role:"user", content:input.trim() };
        const updated = [...messages, userMsg];
        setMessages(updated); setInput(""); setInterim(""); setLoading(true);
        try {
          const reply = await callClaude(KENNIS_SYSTEM, updated);
          setMessages([...updated, { role:"assistant", content:reply }]);
          setMsgCount(c => c + 1);
        } catch(e) {
          setMessages([...updated, { role:"assistant", content:`Fout: ${e.message}` }]);
        }
        setLoading(false);
      };

      const generateSummary = async () => {
        stopMic(); setPhase("summary"); setLoading(true); setSummary(""); setSaved(false);
        const transcript = messages.map(m => `${m.role==="user" ? fullName : "Agent"}: ${m.content}`).join("\n\n");
        try {
          const text = await callClaude(null, [{ role:"user", content:KENNIS_SUMMARY(fullName, transcript) }], 2000);
          setSummary(text);
        } catch(e) { setSummary(`Fout: ${e.message}`); }
        setLoading(false);
      };

      const downloadMd = () => {
        const date = new Date().toISOString().slice(0, 10);
        const slug = fullName.toLowerCase().replace(/\s+/g, "-");
        const blob = new Blob([`# tdme Input — ${fullName}\n_${date}_\n\n---\n\n` + summary], { type:"text/markdown;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = `tdme-input-${slug}-${date}.md`; a.click();
      };

      const handleKey = (e) => { if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };

      if (phase === "start") return (
        <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"28px", padding:"48px 24px" }}>
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:"8px", textAlign:"center" }}>
            <h2 style={{ fontSize:"clamp(24px,4vw,36px)", fontWeight:600, letterSpacing:"-0.5px", color:C.ink }}>Input</h2>
            <p style={{ fontSize:"15px", color:C.mid, maxWidth:"320px", lineHeight:1.55 }}>
              Gerichte vragen om marketingkennis vast te leggen als basis voor de tdme GTM Agent.
            </p>
            <p style={{ fontSize:"13px", color:C.light, maxWidth:"300px", lineHeight:1.6 }}>
              Download de samenvatting achteraf als .md bestand.
            </p>
          </div>
          <div style={{ display:"flex", gap:"10px" }}>
            {["frank","wouter"].map(p => (
              <button key={p} onClick={() => startSession(p)}
                style={{ padding:"12px 28px", background:C.bg, color:C.ink, border:`1px solid ${C.border}`, borderRadius:"980px", fontSize:"15px", fontWeight:500, cursor:"pointer" }}>
                {p === "frank" ? "Frank Schuyer" : "Wouter Mellaart"}
              </button>
            ))}
          </div>
        </div>
      );

      if (phase === "summary") return (
        <div style={{ flex:1, overflow:"auto", padding:"32px", maxWidth:"680px", width:"100%", margin:"0 auto", alignSelf:"center" }}>
          <h2 style={{ fontSize:"22px", fontWeight:600, letterSpacing:"-0.5px", marginBottom:"4px" }}>Samenvatting</h2>
          <p style={{ fontSize:"13px", color:C.light, marginBottom:"24px", paddingBottom:"16px", borderBottom:`1px solid ${C.border}` }}>
            {fullName} · {new Date().toLocaleDateString("nl-NL", { day:"numeric", month:"long", year:"numeric" })}
          </p>
          {loading ? (
            <p style={{ color:C.mid }}>Samenvatting wordt gegenereerd…</p>
          ) : (
            <>
              <div style={{ fontSize:"15px", lineHeight:1.8, whiteSpace:"pre-wrap", color:C.ink }}>{summary}</div>
              <div style={{ display:"flex", gap:"8px", marginTop:"28px", flexWrap:"wrap" }}>
                <button onClick={downloadMd}
                  style={{ padding:"10px 22px", background:C.ink, color:C.white, border:"none", borderRadius:"980px", fontSize:"14px", fontWeight:500, cursor:"pointer" }}>
                  Download .md
                </button>
                <button onClick={() => { navigator.clipboard.writeText(summary); setSaved(true); setTimeout(()=>setSaved(false),2500); }}
                  style={{ padding:"10px 18px", background:"transparent", color:C.ink, border:`1px solid ${C.border}`, borderRadius:"980px", fontSize:"14px", cursor:"pointer" }}>
                  {saved ? "Gekopieerd ✓" : "Kopieer"}
                </button>
                <button onClick={() => { setPhase("chat"); setSummary(""); }}
                  style={{ padding:"10px 14px", background:"transparent", color:C.mid, border:`1px solid ${C.border}`, borderRadius:"980px", fontSize:"14px", cursor:"pointer" }}>
                  ← Terug
                </button>
              </div>
            </>
          )}
        </div>
      );

      return (
        <>
          <div style={{ flex:1, overflow:"auto", padding:"20px 24px", display:"flex", flexDirection:"column", gap:"14px", maxWidth:"680px", width:"100%", margin:"0 auto", alignSelf:"center" }}>
            {messages.map((msg, i) =>
              msg.role === "assistant" ? (
                <div key={i} className="msg-enter" style={{ alignSelf:"flex-start", maxWidth:"82%" }}>
                  <div style={{ background:C.bg, padding:"12px 16px", borderRadius:"4px 18px 18px 18px", fontSize:"15px", lineHeight:1.6, color:C.ink }}>
                    {fmt(msg.content)}
                  </div>
                </div>
              ) : (
                <div key={i} className="msg-enter" style={{ alignSelf:"flex-end", maxWidth:"72%" }}>
                  <div style={{ background:C.ink, padding:"12px 16px", borderRadius:"18px 4px 18px 18px", fontSize:"15px", lineHeight:1.6, color:C.white }}>
                    {fmt(msg.content)}
                  </div>
                </div>
              )
            )}
            {loading && (
              <div style={{ alignSelf:"flex-start" }}>
                <div style={{ background:C.bg, padding:"14px 18px", borderRadius:"4px 18px 18px 18px", display:"inline-flex", gap:"4px", alignItems:"center" }}>
                  {["0s","0.2s","0.4s"].map(d => (
                    <span key={d} style={{ width:"5px", height:"5px", borderRadius:"50%", background:C.light, display:"inline-block", animation:`bounce 1.2s ${d} infinite ease-in-out` }} />
                  ))}
                </div>
              </div>
            )}
            <div ref={bottomRef} />
          </div>
          <div style={{ borderTop:`1px solid ${C.border}`, padding:"10px 20px", background:C.white, flexShrink:0 }}>
            <div style={{ maxWidth:"680px", width:"100%", margin:"0 auto", display:"flex", gap:"8px", alignItems:"flex-end" }}>
              {msgCount >= 1 && (
                <button onClick={generateSummary}
                  style={{ padding:"8px 14px", background:"transparent", color:C.mid, border:`1px solid ${C.border}`, borderRadius:"980px", fontSize:"13px", cursor:"pointer", whiteSpace:"nowrap", flexShrink:0 }}>
                  Samenvatting
                </button>
              )}
              <textarea ref={inputRef}
                style={{ flex:1, padding:"10px 16px", fontSize:"15px", fontFamily:"Inter,-apple-system,sans-serif", border:`1px solid ${C.border}`, borderRadius:"22px", background:C.bg, color:interim ? C.mid : C.ink, resize:"none", minHeight:"42px", maxHeight:"120px", lineHeight:1.5 }}
                value={input + (interim ? " " + interim : "")}
                onChange={e => { if (!listening) setInput(e.target.value); }}
                onKeyDown={handleKey}
                placeholder={listening ? "Luisteren…" : "Typ of spreek…"}
                rows={1} disabled={loading}
              />
              {hasSpeech && (
                <button onClick={toggleMic} disabled={loading}
                  style={{ width:"40px", height:"40px", borderRadius:"50%", border:`1px solid ${listening ? C.ink : C.border}`, background:listening ? C.ink : "transparent", color:listening ? C.white : C.mid, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, animation:listening?"pulse 1.4s infinite":"none", transition:"all 0.2s" }}>
                  <MicIcon on={listening} />
                </button>
              )}
              <button onClick={sendMessage} disabled={!input.trim() || loading}
                style={{ width:"40px", height:"40px", borderRadius:"50%", border:"none", background:!input.trim()||loading ? C.bg : C.ink, color:!input.trim()||loading ? C.light : C.white, cursor:!input.trim()||loading?"not-allowed":"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, transition:"all 0.15s" }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" />
                </svg>
              </button>
            </div>
          </div>
        </>
      );
    }

    // ── KENNISBASIS TAB ──────────────────────────────────────────────────────

    function Kennisbasis({ adminKey }) {
      const [text,    setText]    = useState("");
      const [loading, setLoading] = useState(true);
      const [saving,  setSaving]  = useState(false);
      const [status,  setStatus]  = useState(null); // "ok" | "err"
      const fileRef = useRef(null);

      useEffect(() => {
        fetch(`${WORKER_URL}/system-prompt`, { headers: { "X-Admin-Key": adminKey } })
          .then(r => r.text())
          .then(t => { setText(t); setLoading(false); })
          .catch(() => { setText(""); setLoading(false); });
      }, []);

      const publish = async () => {
        if (!text.trim()) return;
        setSaving(true); setStatus(null);
        try {
          const res = await fetch(`${WORKER_URL}/system-prompt`, {
            method: "PUT",
            headers: { "Content-Type": "text/plain", "X-Admin-Key": adminKey },
            body: text,
          });
          setStatus(res.ok ? "ok" : "err");
        } catch {
          setStatus("err");
        }
        setSaving(false);
        setTimeout(() => setStatus(null), 3000);
      };

      const loadFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => setText(reader.result);
        reader.readAsText(file);
        e.target.value = "";
      };

      return (
        <div style={{ flex:1, overflow:"auto", padding:"28px 32px", maxWidth:"760px", width:"100%", margin:"0 auto", alignSelf:"center", display:"flex", flexDirection:"column", gap:"16px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:"12px" }}>
            <div>
              <h2 style={{ fontSize:"20px", fontWeight:600, letterSpacing:"-0.4px", color:C.ink }}>Kennisbasis</h2>
              <p style={{ fontSize:"13px", color:C.mid, marginTop:"4px" }}>
                Plak of upload een geredigeerde .md en klik op Publiceer. De agent gebruikt deze tekst direct.
              </p>
            </div>
            <div style={{ display:"flex", gap:"8px", alignItems:"center" }}>
              <button onClick={() => fileRef.current?.click()}
                style={{ fontSize:"13px", color:C.mid, background:"transparent", border:`1px solid ${C.border}`, borderRadius:"980px", padding:"6px 14px", cursor:"pointer" }}>
                Upload .md
              </button>
              <input ref={fileRef} type="file" accept=".md,.txt" onChange={loadFile} style={{ display:"none" }} />
              <button onClick={publish} disabled={saving || !text.trim()}
                style={{ fontSize:"13px", fontWeight:500, color:C.white, background:saving || !text.trim() ? C.light : C.ink, border:"none", borderRadius:"980px", padding:"6px 18px", cursor:saving || !text.trim() ? "not-allowed" : "pointer", transition:"background 0.15s" }}>
                {saving ? "Opslaan…" : "Publiceer"}
              </button>
              {status === "ok"  && <span style={{ fontSize:"13px", color:"#27ae60" }}>Gepubliceerd</span>}
              {status === "err" && <span style={{ fontSize:"13px", color:"#c0392b" }}>Fout bij opslaan</span>}
            </div>
          </div>
          {loading ? (
            <p style={{ fontSize:"14px", color:C.mid }}>Laden…</p>
          ) : (
            <textarea
              value={text}
              onChange={e => setText(e.target.value)}
              spellCheck={false}
              style={{ flex:1, minHeight:"60vh", width:"100%", padding:"16px", fontSize:"13px", fontFamily:"'SF Mono','Fira Code',monospace", lineHeight:1.7, border:`1px solid ${C.border}`, borderRadius:"12px", background:C.bg, color:C.ink, resize:"vertical" }}
            />
          )}
          <p style={{ fontSize:"11px", color:C.light }}>{text.length.toLocaleString()} tekens</p>
        </div>
      );
    }

    // ── MAIN APP ─────────────────────────────────────────────────────────────

    function App() {
      const [phase,   setPhase]   = useState("login");
      const [key,     setKey]     = useState("");
      const [keyErr,  setKeyErr]  = useState("");
      const [loading, setLoading] = useState(false);
      const [tab,     setTab]     = useState("gesprekken");

      const login = async () => {
        if (!key.trim()) { setKeyErr("Voer een admin-sleutel in."); return; }
        setLoading(true);
        try {
          const res = await fetch(`${WORKER_URL}/list`, { headers: { "X-Admin-Key": key } });
          if (res.status === 401) { setKeyErr("Ongeldige sleutel."); setLoading(false); return; }
          setPhase("app");
        } catch {
          setKeyErr("Verbindingsfout. Probeer opnieuw.");
        }
        setLoading(false);
      };

      if (phase === "login") return (
        <div style={{ minHeight:"100dvh", display:"flex", flexDirection:"column", background:C.white }}>
          <div style={{ padding:"12px 20px", borderBottom:`1px solid ${C.border}` }}>
            <span style={{ fontSize:"13px", color:C.light, fontWeight:500 }}>tdme · Admin</span>
          </div>
          <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"24px", padding:"48px 24px" }}>
            <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:"8px" }}>
              <p style={{ fontSize:"12px", letterSpacing:"1px", color:C.light }}>tdme · Admin</p>
              <h1 style={{ fontSize:"32px", fontWeight:600, letterSpacing:"-1px", color:C.ink }}>Inloggen</h1>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:"8px", width:"100%", maxWidth:"280px", alignItems:"center" }}>
              <input type="password" placeholder="Admin-sleutel" value={key}
                onChange={e => { setKey(e.target.value); setKeyErr(""); }}
                onKeyDown={e => e.key === "Enter" && login()} autoFocus
                style={{ width:"100%", padding:"11px 16px", fontSize:"15px", fontFamily:"Inter,-apple-system,sans-serif", border:`1px solid ${C.border}`, borderRadius:"980px", background:C.bg, color:C.ink, textAlign:"center", letterSpacing:"2px" }} />
              {keyErr && <p style={{ fontSize:"13px", color:"#c0392b" }}>{keyErr}</p>}
              <button onClick={login} disabled={loading}
                style={{ width:"100%", padding:"11px", background:C.ink, color:C.white, border:"none", borderRadius:"980px", fontSize:"15px", fontWeight:500, cursor:"pointer" }}>
                {loading ? "Laden…" : "Inloggen"}
              </button>
            </div>
          </div>
        </div>
      );

      return (
        <div style={{ minHeight:"100dvh", display:"flex", flexDirection:"column", background:C.white }}>
          <div style={{ padding:"10px 20px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", gap:"16px", flexShrink:0 }}>
            <span style={{ fontSize:"13px", color:C.light, fontWeight:500, marginRight:"8px" }}>tdme · Admin</span>
            {["gesprekken","kennisextractie","kennisbasis"].map(t => (
              <button key={t} onClick={() => setTab(t)}
                style={{ fontSize:"13px", fontWeight:500, background:"transparent", border:"none", borderBottom:`2px solid ${tab === t ? C.ink : "transparent"}`, color:tab === t ? C.ink : C.mid, cursor:"pointer", padding:"4px 0", transition:"all 0.15s" }}>
                {t === "gesprekken" ? "Gesprekken" : t === "kennisextractie" ? "Input" : "Kennisbasis"}
              </button>
            ))}
          </div>
          <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
            {tab === "gesprekken"
              ? <Gesprekken adminKey={key} />
              : tab === "kennisextractie"
              ? <Kennisextractie />
              : <Kennisbasis adminKey={key} />
            }
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
