Je bent de tdme GTM Agent — een directe, praktische sparringpartner voor founders en marketingteams van start-ups en scale-ups. Je combineert de kennis en aanpak van Wouter Mellaart (tdme) en Frank Schuyer, met jarenlange ervaring in het begeleiden van vroeg-stadium bedrijven op het gebied van go-to-market strategie, positionering, B2B marketing en branding.

Je bent geen generieke AI-assistent. Je geeft eerlijk, concreet en soms confronterend advies — altijd gericht op wat de founder morgen kan doen.

KERNFILOSOFIE
- Denk altijd van buiten naar binnen: vanuit het perspectief van de klant, nooit vanuit het product
- Pain/gain als vertrekpunt: welk pain neem je weg, of welke gain bied je? Dit is de kernvraag bij elke propositie
- De juiste volgorde is niet onderhandelbaar: doelgroep → probleemherkenning (bewust én onbewust) → oplossing → winstgevende invulling → pas dan kanaalkeuze
- Verhaal boven features: mensen kopen geen specs maar een uitkomst
- Kleinste bruikbare doelgroep: scherpe propositie voor weinigen werkt beter dan vage boodschap voor iedereen
- Vertrouwen bouw je druppelsgewijs
- Niemand heeft alle antwoorden klaar — dit is een vuistregel om als vertrekpunt te hanteren; het haalt druk weg bij founders en creëert ruimte voor een eerlijk, gezamenlijk proces

DRIE TECHNIEKEN OM HET VERHAAL BOVEN TAFEL TE KRIJGEN
1. Explain Like I'm Five — radicale vereenvoudiging om de kern bloot te leggen
2. Verjaardagstest — "Hoe leg je dit uit op een feestje?" — laagdrempelig en onthullend
3. Expert-spiegelmethode — doe uitgebreid vooronderzoek en benader het gesprek alsof je de markt al kent; dwingt de founder tot scherper denken
Als geen van deze volstaat: bouw het verhaal samen op met de founder. Dit is een volwaardig onderdeel van de aanpak, geen noodoplossing.

VEELGEMAAKTE FOUTEN BIJ FOUNDERS
- Feature-dump in plaats van outcome-communicatie
- Verkopen wat zíj denken dat het product is, terwijl de klant iets anders waardevol vindt
- De echte vraag van de klant niet beantwoorden
- Verdienmodel communiceert verkeerde waarde ("tool" terwijl echte waarde "transformatie" is)
- Te vroeg een VP Sales of CMO inhuren zonder sales playbook — mislukt bijna altijd
- Te klein óf te groot denken
- Onvoldoende nadenken over funding en cashflow
- Eigenwijs zijn: niet openstaan voor externe input — directe overtuiging werkt averechts; zorg dat ze zelf achter de antwoorden komen
- Te snel in middelen denken: accounts aanmaken op TikTok, Instagram, YouTube — zonder strategische basis. Eerste content is dan slecht en het doel ("snel zichtbaar zijn") is verkeerd geformuleerd
- Versnipperde aandacht voor branding: te snel, te veel losse brandinginspanningen zonder coherente visie — inconsistente uitstraling die vertrouwen ondermijnt
- Uitvoering zonder strategisch fundament: enthousiaste medewerker start met content en socials, maar er is geen plan, geen leadfunnel, geen verhaal — content wordt doel in plaats van middel
- Founders zitten te diep in hun eigen oplossing: ze missen het perspectief van hoe het probleem nú in de markt wordt opgelost

WANNEER IS OPSCHALEN VERANTWOORD?
- Founder heeft zelf ~25 deals gesloten
- ARR rond €1M
- Verhaal werkt ook bij koude accounts
- Conversie na demo en offerte: minimaal 25%

POSITIONERING & PROPOSITIE
- Drie pijlers: welk probleem, voor wie, wat is de impact (paracetamol of echte painkiller)?
- Pain wegnemen of gain bieden — bepaal welke van de twee van toepassing is en hoe scherp de founder dit kan verwoorden
- Zoek altijd de echte waarde — die zit soms achter het zichtbare product. Voorbeeld: TRVL leek een iPad-magazine, maar de echte waarde was het collaboratieve technische platform. Michel Elings wist dit zelf — strategische positionering kan betekenen dat je bewust iets anders toont dan je echte waardepropositie
- Tool vs. transformatie: transformatie rechtvaardigt altijd een hogere prijs
- De klant is je beste copywriter — gebruik letterlijk hun woorden
- Buitenperspectief als katalysator: founders kunnen hun eigen propositie vaak niet goed verwoorden omdat ze er te dicht op zitten
- Afronding naar boven is oké, verzinsels zijn dodelijk

GO-TO-MARKET
- Begin bij de echte klantbehoefte, niet het product
- Cruciaal ijkpunt: hoe lost de doelgroep het probleem nú op? Dit bepaalt de werkelijke concurrentiepositie en de adoptiedrempel
- Kijk naar andere landen: hoe hebben vergelijkbare markten zich daar ontwikkeld? Geeft vroeg inzicht in volwassenheid en kansen
- Timing is cruciaal — inschatten of de markt al klaar is
- Founder moet zelf het verhaal kunnen vertellen en deals sluiten vóór opschaling
- Sales playbook: founder levert de content en is het levende bewijs dat het product verkoopbaar is

B2B MARKETING & SALES
- Grootste valkuil: marketing en sales praten niet met elkaar — ook in kleine teams
- In de opstartfase doet de founder vaak zelf sales en belooft dingen die het product nog niet kan — dit ondermijnt latere schaalbaarheid
- Vroeg in gesprek gaan over beloven vs. realiseren, zodat founders er bewust rekening mee houden
- Kernadvies: stem hét verhaal goed af — founder, marketing en sales moeten vanuit dezelfde belofte werken
- Niet overtuigen door te pushen, maar zorgen dat de founder zelf achter de antwoorden komt
- Vertrouwen opbouwen eerst: veel praten, informatie verzamelen, begrijpen waar iemand dagelijks mee bezig is — pas dan ontstaat ruimte voor advies
- Leadfunnel als ontbrekende schakel: veel B2B start-ups hebben uitvoering (content, socials) maar geen doordachte leadfunnel. Eerste stap: begrijpen wat er nu gebeurt, waar leads vandaan komen, waar ze afhaken
- Luister langer en vraag dieper door op acties die al zijn ondernomen — neem die serieus, ook als ze suboptimaal waren
- Gebruik letterlijk de woorden en inzichten van de klant terug in gesprekken en presentaties — het nieuwe idee landt dan als "eigen idee"
- Wees kritisch op uren-voor-aandelen constructies: risicovol, zeker bij eigenzinnige founders

CONTENT & KANALEN
- Kanalen zijn middelen, geen strategie — ze komen pas aan bod als verhaal, doelgroep en propositie helder zijn
- Snelle zichtbaarheid is een gevaarlijk doel: leidt tot verspreide aandacht, slechte content en verspild budget
- Volgorde: 1) verhaal bepalen, 2) doelgroep scherp krijgen, 3) begrijpen waar die doelgroep is en hoe ze informatie consumeren, 4) dan pas kanaalkeuze en contentproductie
- Bewezen kanalen in vroege groeifase: e-mailnieuwsbrief, founder als thought leader (podcasts, vakbladen, beurzen als spreker), LinkedIn, thought leadership blogs/webinars
- Industrie bepaalt aanpak — medische sector: autoriteit via PhD-auteur; bouwtech: klantcases en peer sharing

BRANDING
- Branding is even cruciaal als product-market fit — niet iets voor later, maar parallel
- Branding betekent niet: huisstijlhandboeken. Het gaat om bewust nadenken over design, uitstraling en consistentie vanaf dag één
- Design als positioneringsinstrument: Steve Jobs — "Design is niet alleen hoe het eruit ziet, maar hoe het werkt." Design omvat het hele systeem: product, UX, communicatie, bedrijfsvoering
- Startpunt is altijd de klant: wat ziet en ervaart de klant bij eerste contact? Help de klant om het product eenvoudig te gebruiken en er waarde uit te halen
- Consistentie als merkstrategie: Coolblue heeft "alles voor een glimlach" consequent doorgevoerd in elk touchpoint — dat is het doel
- Dankzij tools als Claude en Gemini hoeft branding in de beginfase niet ingewikkeld of duur te zijn
- Founder narrative (persoonlijke drive) of mission narrative (maatschappelijk probleem) als basis

FRAMEWORKS & MODELLEN
- Jobs-to-be-Done (JTBD): een van de krachtigste modellen — niet het product zelf, maar wat de klant ermee wil bereiken. Toepassen via klantinterviews met recente kopers en AI-ondersteund onderzoek
- Waardedisciplines (Treacy & Wiersema): Operational Excellence, Customer Intimacy, Product Leadership — gebruik dit als begeleid proces waarbij founders zelf tot inzicht komen via de juiste vragen. Heeft directe impact op schaalbaarheidsaanpak
- Seth Godin — This Is Marketing: smallest viable audience, worldview first, verhaal boven features, vertrouwen druppelsgewijs, dien en push niet

OVERIGE VUISTREGELS
- Ervaring versnelt patroonherkenning: senioriteit verlaagt de tijd nodig voor marktanalyse en vergroot geloofwaardigheid bij founders
- "Grijze haren" werken: founders accepteren confronterende feedback sneller van iemand die zichtbaar ervaring heeft
- Niemand heeft alle antwoorden klaar — gebruik dit als vertrekpunt om druk weg te nemen en ruimte te creëren

DOORVRAGEN, MAAR BEGRENSD
- Eén tot twee gerichte vervolgvragen per onderwerp zijn genoeg. Daarna plaats je de founder en ga je door. Doorvragen is een middel, geen doel; blijf niet eindeloos hangen op één punt.
- Toets aannames voordat je ze als feit behandelt: stel de aanname voor als hypothese en vraag om bevestiging of correctie.
- Beweeg je richting een conclusie op basis van een vaag antwoord? Vraag dan eerst om een concreet getal of voorbeeld.

HOE JE WERKT: GESTRUCTUREERD, MET EEN DUIDELIJK EINDE
De intake is vooraf ingevuld als formulier. Je ontvangt de antwoorden als eerste bericht. Gebruik die als vertrekpunt; stel de intakevragen niet opnieuw.

Het gesprek is geen open interview maar een gerichte assessment langs zes onderwerpen. Dit zijn dezelfde assen waarop je later de analyse maakt:
1. Propositie
2. GTM-gereedheid
3. Doelgroepfocus
4. Merkidentiteit
5. Sales-alignment
6. Schaalbaarheid

Werk deze onderwerpen af, één voor één. Houd zelf bij welke al aan bod kwamen en welke nog niet. Forceer de volgorde niet rigide en behandel niet alles even diep; volg waar de founder het meeste vastloopt.

Per onderwerp:
- Stel hooguit één tot twee gerichte vervolgvragen, plaats de founder, en ga door.
- Sluit elk onderwerp af met één korte regel: waar de founder nu staat, plus de éne belangrijkste stap die hem vooruit brengt. Eén scherpe observatie, geen opsomming.
- Geef kort aan dat je doorgaat naar het volgende onderwerp, zodat het gesprek voelt alsof het ergens heen gaat.

Als een antwoord vaag is, vraag dan om concreetheid voordat je verdergaat. Let op woorden als "veel", "sommige", "vaak", "soms" of "binnenkort" en vraag om een getal of voorbeeld ("Hoeveel klanten precies?", "Welke sector?", "Hoeveel deals in de afgelopen drie maanden?"). Een vage propositie of doelgroep is zelf een bevinding; benoem dat.

EINDE VAN HET GESPREK
Het gesprek loopt niet eindeloos door. Zodra de kernonderwerpen behandeld zijn (zeker Propositie, Doelgroepfocus en Sales-alignment), of zodra de founder erom vraagt, rond je af met:
- Een korte stand per besproken onderwerp, één regel per onderwerp
- De twee tot drie grootste knelpunten, op volgorde van belang
- Concrete vervolgstappen die de founder zelf kan zetten
- De zin: "Klik rechtsboven op Analyseer voor je scores per as, of op Samenvatting om dit als document te downloaden."

Stuur actief richting dit einde. Een founder moet het gevoel hebben dat er een uitkomst uitrolt, niet dat hij in een oneindige vragenlijst zit.

TOON
- Direct en eerlijk — ook als het ongemakkelijk is
- Praktisch: altijd gericht op wat de founder morgen kan doen
- Nieuwsgierig: vraag door
- Geen buzzwords of managementtaal
- Houd antwoorden kort: maximaal 3-4 alinea's. Geen uitputtende opsommingen. Liever één scherpe vraag dan drie vage. Schrijf zoals je praat.
- Begin de intake altijd in het Nederlands. Detecteer de taal van de gebruiker tijdens het gesprek en schakel over naar Engels als de gebruiker in het Engels antwoordt. Voer het hele gesprek consequent in dezelfde taal.

GRENZEN
- Geen juridisch, financieel of technisch productadvies
- Bij complexe situaties: adviseer contact met Wouter Mellaart (wouter@tdme.nl) of Frank Schuyer

VOORTGANGSMARKERING (VOOR HET SYSTEEM — NOOIT ZICHTBAAR MAKEN OF BENOEMEN)
Sluit ELK bericht af met, op een nieuwe laatste regel, exact deze markering:
<<TDME:active=<huidig onderwerp>;done=<komma-gescheiden afgeronde onderwerpen>>>
Gebruik bij voorkeur deze namen: Propositie, GTM-gereedheid, Doelgroepfocus, Merkidentiteit, Sales-alignment, Schaalbaarheid. "active" is het onderwerp dat je nu behandelt; "done" zijn de afgeronde onderwerpen. Schrijf nooit uitleg over deze markering en verwijs er niet naar in je antwoord.

Begin met een korte reflectie op de ingevulde intake. Kondig daarna in één zin aan dat je samen een aantal onderwerpen langsloopt (propositie, doelgroep, go-to-market, sales en groei) en dat het gesprek eindigt met een korte analyse en concrete vervolgstappen. Stel daarna direct je eerste verdiepende vraag.`;

      return lang === "en"
        ? `${langNote}Below is the completed intake. Use this as the basis for the conversation.\n\nCompany: ${g("bedrijf")}\nStage: ${g("fase")}\nBusiness model: ${g("verdienmodel")}\nIdeal customer: ${g("idealeKlant")}\nCore promise: ${g("kernbelofte")}\nCompetitors & differentiation: ${g("concurrenten")}\nBiggest challenge: ${g("groeivraagstuk")}\nAlready tried: ${g("geprobeerd")}\nDesired outcome: ${g("gewenstResultaat")}\nGeographic scope: ${g("geoScope")}\nMonthly budget: ${g("budget")}\nTeam size: ${g("teamSize")}\nDedicated marketing/sales: ${g("dedicated")}`
        : `${langNote}Hieronder de ingevulde intake. Gebruik dit als basis voor het gesprek.\n\nBedrijf: ${g("bedrijf")}\nFase: ${g("fase")}\nVerdienmodel: ${g("verdienmodel")}\nIdeale klant: ${g("idealeKlant")}\nKernbelofte: ${g("kernbelofte")}\nConcurrenten & onderscheid: ${g("concurrenten")}\nGrootste vraagstuk: ${g("groeivraagstuk")}\nAl geprobeerd: ${g("geprobeerd")}\nGewenst resultaat gesprek: ${g("gewenstResultaat")}\nGeografische scope: ${g("geoScope")}\nBudget per maand: ${g("budget")}\nTeamgrootte: ${g("teamSize")}\nDedicated marketing/sales: ${g("dedicated")}`;

    // ─── FILE HANDLING ────────────────────────────────────────────────────────

    const ACCEPTED = ".pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.md,.csv";

    const readFile = (file) => new Promise((resolve, reject) => {
      const type = file.type;
      const isText = type.startsWith("text/") || file.name.endsWith(".md") || file.name.endsWith(".csv");
      if (isText) {
        const reader = new FileReader();
        reader.onload = () => resolve({ kind:"text", name:file.name, content:reader.result });
        reader.onerror = reject;
        reader.readAsText(file);
      } else {
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(",")[1];
          resolve({ kind: type === "application/pdf" ? "pdf" : "image", name:file.name, mediaType:type, base64 });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      }
    });

    const buildContent = (text, attachment) => {
      if (!attachment) return text;
      const parts = [];
      if (attachment.kind === "pdf") {
        parts.push({ type:"document", source:{ type:"base64", media_type:"application/pdf", data:attachment.base64 } });
      } else if (attachment.kind === "image") {
        parts.push({ type:"image", source:{ type:"base64", media_type:attachment.mediaType, data:attachment.base64 } });
      } else if (attachment.kind === "text") {
        parts.push({ type:"text", text:`[Bijlage: ${attachment.name}]\n\n${attachment.content}\n\n---\n` });
      }
      if (text.trim()) parts.push({ type:"text", text });
      else parts.push({ type:"text", text:"Zie het bijgevoegde document." });
      return parts;
    };

    function RadarChart({ data, size = 280 }) {
      const n = data.length;
      const cx = size / 2, cy = size / 2, r = size * 0.32;
      const ang = (i) => (2 * Math.PI * i / n) - Math.PI / 2;
      const pt  = (i, s) => ({ x: cx + r * (s / 10) * Math.cos(ang(i)), y: cy + r * (s / 10) * Math.sin(ang(i)) });

      const gridLevels = [0.25, 0.5, 0.75, 1].map(ratio =>
        data.map((_, i) => `${cx + r * ratio * Math.cos(ang(i))},${cy + r * ratio * Math.sin(ang(i))}`).join(" ")
      );
      const dataPoints = data.map((d, i) => { const p = pt(i, d.score); return `${p.x},${p.y}`; }).join(" ");

      return (
        <svg className="radar-svg" width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:"block", margin:"0 auto" }}>
          {gridLevels.map((pts, l) => <polygon key={l} points={pts} fill="none" stroke="#e5e5ea" strokeWidth="1" />)}
          {data.map((_, i) => <line key={i} x1={cx} y1={cy} x2={cx + r * Math.cos(ang(i))} y2={cy + r * Math.sin(ang(i))} stroke="#e5e5ea" strokeWidth="1" />)}
          <polygon points={dataPoints} fill="rgba(29,29,31,0.08)" stroke="#1d1d1f" strokeWidth="2" />
          {data.map((d, i) => { const p = pt(i, d.score); return <circle key={i} cx={p.x} cy={p.y} r="4" fill="#1d1d1f" />; })}
          {data.map((d, i) => {
            const lr = r + 28;
            const x = cx + lr * Math.cos(ang(i)), y = cy + lr * Math.sin(ang(i));
            return (
              <g key={i}>
                <text x={x} y={y - 5}  textAnchor="middle" fontSize="9"  fontFamily="Inter,sans-serif" fill="#6e6e73">{d.naam}</text>
                <text x={x} y={y + 8}  textAnchor="middle" fontSize="11" fontFamily="Inter,sans-serif" fontWeight="600" fill="#1d1d1f">{d.score}</text>
              </g>
            );
          })}
        </svg>
      );
    }

    // ─── INTAKE FORM ──────────────────────────────────────────────────────────

    function IntakeForm({ onComplete, lang }) {

          {/* Question card */}
          <div key={animKey} className="slide-in"

                {t.prevBtn}

              <button onClick={goNext} disabled={!isAnswered()}

                {current === total - 1 ? t.startChatBtn : t.nextBtn}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── MAIN COMPONENT ───────────────────────────────────────────────────────

    function Agent() {
      const [phase,          setPhase]          = useState("access");
      const [lang,           setLang]           = useState("nl");
      const [code,           setCode]           = useState("");
      const [codeErr,        setCodeErr]        = useState("");
      const [messages,       setMessages]       = useState([]);
      const [input,          setInput]          = useState("");
      const [loading,        setLoading]        = useState(false);
      const [listening,      setListening]      = useState(false);
      const [interim,        setInterim]        = useState("");
      const [attachment,     setAttachment]     = useState(null);
      const [fileErr,        setFileErr]        = useState("");
      const [summaryLoading, setSummaryLoading] = useState(false);
      const [diagram,        setDiagram]        = useState(null);
      const [genDiagram,     setGenDiagram]     = useState(false);

      const TOPICS = ["Propositie","GTM-gereedheid","Doelgroepfocus","Merkidentiteit","Sales-alignment","Schaalbaarheid"];
      const [activeTopic, setActiveTopic] = useState(null);
      const [doneTopics,  setDoneTopics]  = useState([]);

      const normTopic  = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      const matchTopic = (raw) => { const r = normTopic(raw); return TOPICS.find(t => normTopic(t) === r) || null; };

      const parseProgress = (text) => {
        const m = text.match(/<<TDME:([^>]*)>>/);
        if (!m) return null;
        const activeRaw = (m[1].match(/active=([^;]*)/) || [])[1] || "";
        const doneRaw   = ((m[1].match(/done=([^;]*)/) || [])[1] || "").split(",");
        return { active: matchTopic(activeRaw), done: doneRaw.map(matchTopic).filter(Boolean) };
      };
      const stripProgress = (text) => text.replace(/\s*<<TDME:[^>]*>>\s*$/, "").trim();
      const applyProgress = (reply) => {
        const p = parseProgress(reply);
        if (!p) return;
        if (p.active) setActiveTopic(p.active);
        if (p.done.length) setDoneTopics(prev => Array.from(new Set([...prev, ...p.done])));
      };

      const bottomRef  = useRef(null);
      const lastMsgRef = useRef(null);
      const inputRef   = useRef(null);
      const fileRef    = useRef(null);
      const recognizer = useRef(null);

      useEffect(() => {
        if (loading) {
          bottomRef.current?.scrollIntoView({ behavior:"smooth" });
        } else {
          lastMsgRef.current?.scrollIntoView({ behavior:"smooth", block:"start" });
        }
      }, [messages, loading]);
      useEffect(() => { if (phase === "chat" && !loading) inputRef.current?.focus(); }, [phase, loading]);

      useEffect(() => {
        if (!hasSpeech) return;
        const r = new SpeechRecognition();
        r.continuous = true; r.interimResults = true;
        r.onresult = (e) => {
          let fin = "", intr = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            e.results[i].isFinal ? fin += t : intr += t;
          }
          if (fin) setInput(p => (p + " " + fin).trim());
          setInterim(intr);
        };
        r.onend  = () => { setListening(false); setInterim(""); };
        r.onerror= () => { setListening(false); setInterim(""); };
        recognizer.current = r;
        return () => { try { r.stop(); } catch(_) {} };
      }, []);

      const toggleMic = () => {
        if (!hasSpeech) return;
        if (listening) { recognizer.current.stop(); setListening(false); }
        else { try { recognizer.current.lang = lang === "en" ? "en-US" : "nl-NL"; recognizer.current.start(); setListening(true); } catch(_) {} }
      };
      const stopMic = () => { if (listening) { recognizer.current.stop(); setListening(false); } };

      const handleFileChange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setFileErr("");
        if (file.size > 10 * 1024 * 1024) { setFileErr(T[lang].fileTooBig); return; }
        try { setAttachment(await readFile(file)); }
        catch { setFileErr(T[lang].fileReadError); }
        e.target.value = "";
      };

      const startChat = () => {
        if (code.trim().toLowerCase() !== ACCESS_CODE) { setCodeErr(T[lang].invalidCode); return; }
        setPhase("intake");
      };

      const uploadIntakeMd = async (e) => {
        if (code.trim().toLowerCase() !== ACCESS_CODE) { setCodeErr(T[lang].invalidCode); return; }
        const file = e.target.files?.[0];
        if (!file) return;
        const text = await file.text();
        setPhase("chat");
        setLoading(true);
        const userMsg = { role:"user", content: text };
        try {
          const reply = await callClaude([userMsg]);
          applyProgress(reply);
          const initial = [userMsg, { role:"assistant", content:stripProgress(reply) }];
          setMessages(initial);
          saveConversation(initial);
        } catch(err) {
          setMessages([userMsg, { role:"assistant", content:`Fout: ${err.message}` }]);
        }
        setLoading(false);
        e.target.value = "";
      };

      const completeIntake = async (answers) => {
        setPhase("chat");
        setLoading(true);
        const userMsg = { role:"user", content: buildIntakeMessage(answers, lang) };
        try {
          const reply = await callClaude([userMsg]);
          applyProgress(reply);
          const initial = [userMsg, { role:"assistant", content:stripProgress(reply) }];
          setMessages(initial);
          saveConversation(initial);
        } catch(e) {
          setMessages([userMsg, { role:"assistant", content:`Fout: ${e.message}` }]);
        }
        setLoading(false);
      };

      const sendMessage = async () => {
        stopMic();
        if ((!input.trim() && !attachment) || loading) return;
        const content = buildContent(input.trim(), attachment);
        const userMsg = { role:"user", content };
        const updated = [...messages, userMsg];
        setMessages(updated); setInput(""); setInterim(""); setAttachment(null); setLoading(true); setDiagram(null);
        try {
          const reply = await callClaude(updated);
          applyProgress(reply);
          const next = [...updated, { role:"assistant", content:stripProgress(reply) }];
          setMessages(next);
          saveConversation(next);
        } catch(e) {
          setMessages([...updated, { role:"assistant", content:`Fout: ${e.message}` }]);
        }
        setLoading(false);
      };

      const downloadDiagram = () => {
        if (!diagram) return;
        const svgEl = document.querySelector(".radar-svg");
        if (!svgEl) return;
        const svgData = new XMLSerializer().serializeToString(svgEl);
        const svgBlob = new Blob([svgData], { type:"image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(svgBlob);
        const dpr = 2;
        const W = 640, rowH = 34, chartSize = 280;
        const H = 56 + chartSize + 32 + diagram.assen.length * rowH + 48;
        const canvas = document.createElement("canvas");
        canvas.width = W * dpr; canvas.height = H * dpr;
        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);

        // header
        ctx.font = "400 11px -apple-system,sans-serif";
        ctx.fillStyle = "#aeaeb2";
        ctx.textAlign = "center";
        ctx.fillText(`tdme GTM Agent  -  ${diagram.bedrijf}`, W / 2, 28);

        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, (W - chartSize) / 2, 48, chartSize, chartSize);

          // find widest axis name to set toel start dynamically
          ctx.font = "500 13px -apple-system,sans-serif";
          const nameColW = Math.max(...diagram.assen.map(as => ctx.measureText(as.naam).width));
          const xScore = 40, xNaam = 76, xToel = xNaam + nameColW + 20;
          const maxToel = W - xToel - 32;

          const listTop = 48 + chartSize + 28;
          diagram.assen.forEach((as, i) => {
            const y = listTop + i * rowH;
            ctx.textAlign = "left";

            ctx.font = "600 13px -apple-system,sans-serif";
            ctx.fillStyle = "#1d1d1f";
            ctx.fillText(String(as.score), xScore, y);

            ctx.font = "500 13px -apple-system,sans-serif";
            ctx.fillStyle = "#1d1d1f";
            ctx.fillText(as.naam, xNaam, y);

            ctx.font = "400 12px -apple-system,sans-serif";
            ctx.fillStyle = "#6e6e73";
            let toel = as.toelichting;
            while (ctx.measureText(toel).width > maxToel && toel.length > 10) toel = toel.slice(0, -1);
            if (toel !== as.toelichting) toel += "...";
            ctx.fillText("- " + toel, xToel, y);
          });

          canvas.toBlob(blob => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `tdme-analyse-${diagram.bedrijf.replace(/\s+/g,"-").toLowerCase()}.png`;
            a.click();
          }, "image/png");
          URL.revokeObjectURL(url);
        };
        img.src = url;
      };

      const generateDiagram = async () => {
        setGenDiagram(true);
        setDiagram(null);
        const transcript = messages
          .filter((_, i) => i > 0)
          .map(m => `${m.role === "assistant" ? "Agent" : "Founder"}: ${typeof m.content === "string" ? m.content : m.content.filter(b => b.type === "text").map(b => b.text).join(" ")}`)
          .join("\n\n");
        try {
          const reply = await callClaude([{ role:"user", content: DIAGRAM_PROMPT(transcript) }], 800);
          const clean = reply.replace(/```json|```/g, "").trim();
          const parsed = JSON.parse(clean);
          setDiagram(parsed);
          saveConversation(messages, parsed);
        } catch {
          setDiagram({ error: lang === "en" ? "Could not generate diagram. Please try again." : "Kon diagram niet genereren. Probeer opnieuw." });
        }
        setGenDiagram(false);
      };

      const generateSummary = async () => {
        setSummaryLoading(true);
        const summaryPrompt = T[lang].summaryPrompt;
        try {
          const summary = await callClaude([...messages, { role:"user", content: summaryPrompt }], 2500);
          downloadMd([{ role:"assistant", content: summary }], "tdme-samenvatting", T[lang].downloadSummaryTitle);
        } catch(e) {
          alert(`Fout bij genereren samenvatting: ${e.message}`);
        }
        setSummaryLoading(false);
      };

      const handleKey     = (e) => { if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
      const handleCodeKey = (e) => { if (e.key==="Enter") startChat(); };
      const canSend       = (input.trim() || attachment) && !loading;

      const getDisplayText = (msg) => {
        if (typeof msg.content === "string") return msg.content;
        return msg.content.filter(b => b.type === "text").map(b => b.text).join(" ")
          .replace(/^\[Bijlage:.*?\]\n\n.*?\n\n---\n/s, "").trim();
      };

      const getAttachmentLabel = (msg) => {
        if (!Array.isArray(msg.content)) return null;
        const doc = msg.content.find(b => b.type === "document");
        const img = msg.content.find(b => b.type === "image");
        const txt = msg.content.find(b => b.type === "text" && b.text.startsWith("[Bijlage:"));
        if (doc) return "PDF";
        if (img) return "Afbeelding";
        if (txt) { const m = txt.text.match(/\[Bijlage: (.+?)\]/); return m ? m[1] : "Bestand"; }
        return null;
      };

      // ── ACCESS ────────────────────────────────────────────────────────────
      if (phase === "access") return (
        <div style={{ minHeight:"100dvh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"32px", padding:"48px 24px", background:C.white }}>
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:"10px" }}>
            <p style={{ fontSize:"12px", letterSpacing:"1px", color:C.light, fontWeight:500 }}>tdme · GTM Agent <span style={{ fontSize:"11px", background:C.bg, border:`1px solid ${C.border}`, borderRadius:"4px", padding:"1px 6px", marginLeft:"2px" }}>v0.8</span></p>
            <h1 style={{ fontSize:"clamp(28px,4vw,44px)", fontWeight:600, letterSpacing:"-1px", color:C.ink, lineHeight:1.1, textAlign:"center" }}>{T[lang].headline}</h1>
            <p style={{ fontSize:"16px", color:C.mid, textAlign:"center", maxWidth:"320px", lineHeight:1.55, marginTop:"4px" }}>
              {T[lang].subtitle}
            </p>
          </div>

          {/* Language toggle */}
          <div style={{ display:"flex", gap:"6px", background:C.bg, borderRadius:"980px", padding:"4px" }}>
            {["nl", "en"].map(l => (
              <button key={l} onClick={() => setLang(l)}
                style={{ padding:"7px 18px", fontSize:"13px", fontWeight:500, border:"none", borderRadius:"980px", background:lang === l ? C.ink : "transparent", color:lang === l ? C.white : C.mid, cursor:"pointer", transition:"all 0.15s" }}>
                {l.toUpperCase()}
              </button>
            ))}
          </div>

          <div style={{ display:"flex", flexDirection:"column", gap:"8px", width:"100%", maxWidth:"280px", alignItems:"center" }}>
            <input type="password" placeholder={T[lang].codePlaceholder} value={code}
              onChange={e => { setCode(e.target.value); setCodeErr(""); }}
              onKeyDown={handleCodeKey} autoFocus
              style={{ width:"100%", padding:"11px 16px", fontSize:"15px", fontFamily:"Inter,-apple-system,sans-serif", border:`1px solid ${C.border}`, borderRadius:"980px", background:C.bg, color:C.ink, textAlign:"center", letterSpacing:"2px" }} />
            {codeErr && <p style={{ fontSize:"13px", color:C.red }}>{codeErr}</p>}
            <button onClick={startChat}
              style={{ width:"100%", padding:"11px", background:C.ink, color:C.white, border:"none", borderRadius:"980px", fontSize:"15px", fontWeight:500, cursor:"pointer" }}>
              {T[lang].startBtn}
            </button>
            {code.trim().toLowerCase() === ACCESS_CODE && (
              <label style={{ fontSize:"13px", color:C.mid, cursor:"pointer", textDecoration:"underline", textDecorationColor:C.border }}>
                {lang === "en" ? "Skip intake — upload .md file" : "Intake overslaan — upload .md bestand"}
                <input type="file" accept=".md,.txt" onChange={uploadIntakeMd} style={{ display:"none" }} />
              </label>
            )}
          </div>
        </div>
      );

      // ── INTAKE ────────────────────────────────────────────────────────────
      if (phase === "intake") return <IntakeForm onComplete={completeIntake} lang={lang} />;

      // ── CHAT ──────────────────────────────────────────────────────────────
      return (
        <div className="tdme-layout">
          <aside className="tdme-side">
            <div className="tdme-side-label">Onderwerpen</div>
            <div className="tdme-topics">
              {TOPICS.map(t => {
                const done = doneTopics.includes(t);
                const active = activeTopic === t;
                return (
                  <div key={t} className="tdme-topic" style={{ background: active ? C.bg : "transparent" }}>
                    <span style={{ width:"16px", height:"16px", borderRadius:"50%", flexShrink:0, border:`1.5px solid ${done || active ? C.ink : C.border}`, background:done ? C.ink : "transparent", display:"grid", placeItems:"center" }}>
                      {done && <svg width="9" height="9" viewBox="0 0 12 12"><path d="M2.5 6.2l2.2 2.2 4.8-5" stroke="#fff" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>}
                    </span>
                    <span style={{ fontSize:"13px", fontWeight:active ? 600 : 500, color:done ? C.light : active ? C.ink : C.mid }}>{t}</span>
                  </div>
                );
              })}
            </div>
            <p className="tdme-side-foot">De agent loopt deze onderwerpen langs en sluit af met een analyse.</p>
          </aside>
          <div className="tdme-main">
        <div style={{ height:"100%", display:"flex", flexDirection:"column", background:C.white }}>

          {/* Header */}
          <div style={{ padding:"12px 20px", borderBottom:`1px solid ${C.border}`, display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0, position:"sticky", top:0, background:C.white, zIndex:10 }}>
            <span style={{ fontSize:"13px", color:C.light, fontWeight:500 }}>tdme · GTM Agent <span style={{ fontSize:"11px", background:C.bg, border:`1px solid ${C.border}`, borderRadius:"4px", padding:"1px 6px", marginLeft:"4px", letterSpacing:"0" }}>v0.8</span></span>
            <div style={{ display:"flex", gap:"8px" }}>
              {messages.length >= 6 && (
                <button onClick={generateDiagram} disabled={genDiagram}
                  style={{ fontSize:"12px", color:C.ink, background:"transparent", border:`1px solid ${C.ink}`, borderRadius:"980px", padding:"5px 12px", cursor:genDiagram ? "not-allowed" : "pointer", opacity:genDiagram ? 0.5 : 1 }}>
                  {genDiagram ? (lang === "en" ? "Analysing…" : "Analyseren…") : (lang === "en" ? "Analyse" : "Analyseer")}
                </button>
              )}
              <button onClick={generateSummary} disabled={summaryLoading || messages.length < 2}
                style={{ fontSize:"12px", color:(summaryLoading || messages.length < 2) ? C.light : C.mid, background:"transparent", border:`1px solid ${C.border}`, borderRadius:"980px", padding:"5px 12px", cursor:(summaryLoading || messages.length < 2) ? "not-allowed" : "pointer" }}>
                {summaryLoading ? T[lang].summaryLoading : T[lang].summaryBtn}
              </button>
              <button onClick={() => downloadMd(messages.slice(1), "tdme-gesprek", T[lang].downloadTitle)}
                style={{ fontSize:"12px", color:C.mid, background:"transparent", border:`1px solid ${C.border}`, borderRadius:"980px", padding:"5px 12px", cursor:"pointer" }}>
                {T[lang].downloadBtn}
              </button>
            </div>
          </div>

          {/* Messages */}
          <div style={{ flex:1, overflow:"auto", padding:"20px 24px", display:"flex", flexDirection:"column", gap:"14px", maxWidth:"680px", width:"100%", margin:"0 auto", alignSelf:"center" }}>
            {messages.map((msg, i) => {
              if (i === 0 && msg.role === "user") return null;
              const attachLabel = msg.role === "user" ? getAttachmentLabel(msg) : null;
              const displayText = getDisplayText(msg);
              const isLast = i === messages.length - 1;
              return msg.role === "assistant" ? (
                <div key={i} ref={isLast ? lastMsgRef : null} className="msg-enter" style={{ alignSelf:"flex-start", maxWidth:"85%" }}>
                  <div style={{ background:C.bg, padding:"12px 16px", borderRadius:"4px 18px 18px 18px", fontSize:"15px", lineHeight:1.65, color:C.ink }}>
                    {fmt(displayText)}
                  </div>
                </div>
              ) : (
                <div key={i} className="msg-enter" style={{ alignSelf:"flex-end", maxWidth:"75%", display:"flex", flexDirection:"column", gap:"4px", alignItems:"flex-end" }}>
                  {attachLabel && (
                    <div style={{ fontSize:"12px", color:C.mid, background:C.bg, border:`1px solid ${C.border}`, borderRadius:"980px", padding:"3px 10px" }}>
                      {attachLabel}
                    </div>
                  )}
                  {displayText && (
                    <div style={{ background:C.ink, padding:"12px 16px", borderRadius:"18px 4px 18px 18px", fontSize:"15px", lineHeight:1.65, color:C.white }}>
                      {fmt(displayText)}
                    </div>
                  )}
                </div>
              );
            })}
            {loading && (
              <div style={{ alignSelf:"flex-start" }}>
                <div style={{ background:C.bg, padding:"14px 18px", borderRadius:"4px 18px 18px 18px", display:"inline-flex", gap:"4px", alignItems:"center" }}>
                  {["0s","0.2s","0.4s"].map(d => (
                    <span key={d} style={{ width:"5px", height:"5px", borderRadius:"50%", background:C.light, display:"inline-block", animation:`bounce 1.2s ${d} infinite ease-in-out` }} />
                  ))}
                </div>
              </div>
            )}
            {diagram && !diagram.error && (
              <div className="msg-enter" style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:"16px", padding:"20px", marginTop:"8px", position:"relative" }}>
                <button onClick={() => setDiagram(null)}
                  style={{ position:"absolute", top:"12px", right:"14px", background:"transparent", border:"none", fontSize:"16px", color:C.light, cursor:"pointer", lineHeight:1 }}>×</button>
                <p style={{ fontSize:"12px", letterSpacing:"1px", textTransform:"uppercase", color:C.light, marginBottom:"16px", textAlign:"center" }}>
                  {lang === "en" ? "Analysis" : "Analyse"} · {diagram.bedrijf}
                </p>
                <RadarChart data={diagram.assen} />
                <div style={{ marginTop:"20px", display:"flex", flexDirection:"column", gap:"8px" }}>
                  {diagram.assen.map((as, i) => (
                    <div key={i} style={{ display:"flex", gap:"10px", alignItems:"flex-start" }}>
                      <span style={{ fontSize:"13px", fontWeight:600, color:C.ink, minWidth:"28px" }}>{as.score}</span>
                      <div>
                        <span style={{ fontSize:"13px", fontWeight:500, color:C.ink }}>{as.naam}</span>
                        <span style={{ fontSize:"13px", color:C.mid }}> — {as.toelichting}</span>
                      </div>
                    </div>
                  ))}
                </div>
                <div style={{ marginTop:"16px", textAlign:"center" }}>
                  <button onClick={downloadDiagram}
                    style={{ fontSize:"12px", color:C.mid, background:"transparent", border:`1px solid ${C.border}`, borderRadius:"980px", padding:"5px 14px", cursor:"pointer" }}>
                    {lang === "en" ? "Download PNG" : "Download PNG"}
                  </button>
                </div>
              </div>
            )}
            {diagram?.error && (
              <p style={{ fontSize:"13px", color:C.mid, fontStyle:"italic" }}>{diagram.error}</p>
            )}
            <div ref={bottomRef} />
          </div>

          {/* Input area */}
          <div style={{ borderTop:`1px solid ${C.border}`, padding:"10px 20px", background:C.white, flexShrink:0 }}>
            <div style={{ maxWidth:"680px", width:"100%", margin:"0 auto" }}>
              {(attachment || fileErr) && (
                <div style={{ marginBottom:"8px", display:"flex", alignItems:"center", gap:"8px" }}>
                  {attachment && (
                    <div style={{ display:"flex", alignItems:"center", gap:"6px", background:C.bg, border:`1px solid ${C.border}`, borderRadius:"980px", padding:"4px 12px", fontSize:"13px", color:C.mid }}>
                      <span>{attachment.kind === "pdf" ? "📄" : attachment.kind === "image" ? "🖼️" : "📝"}</span>
                      <span style={{ maxWidth:"200px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{attachment.name}</span>
                      <button onClick={() => setAttachment(null)}
                        style={{ background:"none", border:"none", cursor:"pointer", color:C.light, fontSize:"14px", lineHeight:1, padding:"0 0 0 2px" }}>×</button>
                    </div>
                  )}
                  {fileErr && <span style={{ fontSize:"12px", color:C.red }}>{fileErr}</span>}
                </div>
              )}
              <div style={{ display:"flex", gap:"8px", alignItems:"flex-end" }}>
                <button onClick={() => fileRef.current?.click()} disabled={loading}
                  title="Voeg bestand toe (PDF, afbeelding of tekst)"
                  style={{ width:"40px", height:"40px", borderRadius:"50%", border:`1px solid ${C.border}`, background:"transparent", color:C.mid, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, transition:"all 0.2s" }}>
                  <PaperclipIcon />
                </button>
                <input ref={fileRef} type="file" accept={ACCEPTED} onChange={handleFileChange} style={{ display:"none" }} />
                <textarea ref={inputRef}
                  style={{ flex:1, padding:"10px 16px", fontSize:"15px", fontFamily:"Inter,-apple-system,sans-serif", border:`1px solid ${C.border}`, borderRadius:"22px", background:C.bg, color:interim?C.mid:C.ink, resize:"none", minHeight:"42px", maxHeight:"120px", lineHeight:1.5 }}
                  value={input + (interim ? " " + interim : "")}
                  onChange={e => { if (!listening) setInput(e.target.value); }}
                  onKeyDown={handleKey}
                  placeholder={listening ? T[lang].listeningPlaceholder : T[lang].inputPlaceholder}
                  rows={1} disabled={loading}
                />
                {hasSpeech && (
                  <button onClick={toggleMic} disabled={loading}
                    style={{ width:"40px", height:"40px", borderRadius:"50%", border:`1px solid ${listening?C.ink:C.border}`, background:listening?C.ink:"transparent", color:listening?C.white:C.mid, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, animation:listening?"pulse 1.4s infinite":"none", transition:"all 0.2s" }}>
                    <MicIcon on={listening} />
                  </button>
                )}
                <button onClick={sendMessage} disabled={!canSend}
                  style={{ width:"40px", height:"40px", borderRadius:"50%", border:"none", background:canSend?C.ink:C.bg, color:canSend?C.white:C.light, cursor:canSend?"pointer":"not-allowed", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, transition:"all 0.15s" }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Agent />);
  </script>
</body>
</html>
